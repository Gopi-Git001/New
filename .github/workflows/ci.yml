name: CI
on:
  pull_request:
  push:
    branches: [main, feature/clean-bad-ugly-jev-sugarcane]
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Brand tokens in sync (app and site)
        run: node scripts/sync-tokens.mjs --check
      - name: Type check
        run: npx tsc --noEmit
      - name: Rules and app tests
        run: npm run test:rules
      - name: Dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
