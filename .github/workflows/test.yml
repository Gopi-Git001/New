name: Tests
# npm test, split into steps: unit tests, then the local Supabase stack, pgTAP and the Deno
# Edge Function tests. Everything runs against the stack started here; no real API keys.
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Unit tests (rules, policy, combine)
        run: npm run test:unit
      - name: Start local Supabase
        run: npx supabase start
      - name: Database tests (supabase test db)
        run: npx supabase test db
      - name: Edge Function tests (deno test)
        run: npm run test:functions
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
